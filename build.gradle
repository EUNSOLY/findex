// ===============================================================
// 플러그인: Gradle에 기능을 추가하는 확장 모듈
// ===============================================================
plugins {
    id 'java'                                              // 자바 컴파일/테스트/jar 빌드 기본 기능
    id 'org.springframework.boot' version '4.1.1'          // bootRun, bootJar 등 Spring Boot 실행/패키징 기능
    id 'io.spring.dependency-management' version '1.1.7'   // 의존성 버전을 Spring Boot가 관리 → 아래 dependencies에 버전 안 적어도 됨
    id 'com.diffplug.spotless' version '8.10.2'            // 코드 포맷터 (spotlessApply: 자동 정리, spotlessCheck: 검사만)
    id 'checkstyle'                                        // 코드 규칙 검사 (Gradle 내장 플러그인이라 버전 불필요)
}


// 프로젝트 식별 정보 (jar 파일 이름 등에 사용)
group = 'com.eunsoly'
version = '0.0.1-SNAPSHOT'

// 사용할 자바 버전 지정 (로컬에 설치된 JDK와 상관없이 21로 빌드)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 라이브러리를 어디서 내려받을지 (Maven 중앙 저장소)
repositories {
    mavenCentral()
}

// ===============================================================
// 의존성 (사용하는 라이브러리)
//   implementation          : 컴파일 + 실행 모두 필요
//   compileOnly             : 컴파일할 때만 필요 (실행 파일엔 안 들어감)
//   runtimeOnly             : 실행할 때만 필요 (코드에서 직접 import 안 함)
//   annotationProcessor     : 컴파일 중 애노테이션을 보고 코드를 생성하는 도구
//   test~                   : 위와 같지만 테스트 코드에서만 사용
// ===============================================================
dependencies {
    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    // H2 메모리 DB용으로 테스트 작업 시 사용
    implementation 'org.springframework.boot:spring-boot-h2console'
    // JDBC
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // 스웨거(API 문서)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    // DBDriver : postgresql
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    // QueryDSL: 타입 안전한 동적 쿼리 작성 도구
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.0'          // QueryDSL 본체 (JPAQueryFactory 등 쿼리 작성 기능)
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.0:jpa' // 컴파일 시 @Entity를 찾아 Q클래스(QIndexInformation 등) 자동 생성
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"         // 생성된 Q클래스에 붙는 @Generated 애노테이션 제공
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"       // Q클래스 생성기가 @Entity, @Id 등 JPA 애노테이션을 인식하는 데 필요

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

}


// ===============================================================
// Spotless: 코드 포맷 규칙 설정
//   ./gradlew spotlessApply : 아래 규칙대로 코드를 자동 수정
//   ./gradlew spotlessCheck : 규칙 위반 여부만 검사 (수정 X, CI에서 주로 사용)
// ===============================================================
spotless {
    // 자바 파일(src/**/*.java)에 적용할 규칙
    java {
        // 구글 자바 포멧 적용
        googleJavaFormat().aosp()
    }
}

// ===============================================================
// Git pre-commit 훅 자동 설치
// ===============================================================

// 1) scripts/pre-commit 파일을 .git/hooks/ 폴더로 복사
// (git은 .git/hooks/pre-commit 파일을 커밋 직전에 자동 실행함)
tasks.register("updateGitHooks", Copy) {
    from("${rootDir}/scripts") {
        include "pre-commit", "commit-msg"   // 설치할 훅 목록
    }
    into("${rootDir}/.git/hooks")
}

// 2) 복사된 훅 파일에 실행 권한 부여 (권한이 없으면 git이 훅을 실행하지 않음)
// Exec = 터미널 명령을 실행하는 태스크 (Mac/Linux에서 chmod로 실행 권한 부여)
tasks.register("makeGitHooksExecutable", Exec) {
    // Windows면 이 태스크를 건너뜀 (실행 권한 개념이 없어서 불필요)
    onlyIf { !System.getProperty("os.name").toLowerCase().contains("windows") }

    commandLine("chmod", "+x", "${rootDir}/.git/hooks/pre-commit", "${rootDir}/.git/hooks/commit-msg")

    // 이 태스크 실행 전에 updateGitHooks(복사)를 먼저 실행
    dependsOn("updateGitHooks")
}

// 3) 자바 컴파일이 일어날 때마다 훅 설치를 먼저 실행
//    → build, bootRun, test 등 컴파일이 포함된 작업만 해도 훅이 자동으로 깔림
//    실행 순서: updateGitHooks → makeGitHooksExecutable → compileJava
tasks.withType(JavaCompile).configureEach {
    dependsOn("makeGitHooksExecutable")
}

// ===============================================================
// Checkstyle: 코드 규칙 검사 (네이밍, Javadoc 등 포맷터가 못 고치는 규칙)
//   ./gradlew checkstyleMain : 메인 코드 검사
//   ./gradlew checkstyleTest : 테스트 코드 검사
// ===============================================================
checkstyle {
    toolVersion = '13.7.0'   // Checkstyle 버전 (google_checks.xml과 버전을 맞춰야 함)
    maxWarnings = 0          // 경고가 하나라도 있으면 실패 처리
    // configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")   (Gradle 기본 위치라 따로 지정 안함)
}


// 테스트 실행 시 JUnit 5 (JUnit Platform) 사용
tasks.named('test') {
    useJUnitPlatform()
}

// 훅에서 -PcheckstyleIncludes=파일목록 으로 넘기면 그 파일만 검사
// (값이 없으면 기존처럼 전체 검사 → CI, ./gradlew build는 그대로 전체 검사)
tasks.withType(Checkstyle).configureEach {
    def includes = project.findProperty('checkstyleIncludes')
    if (includes) {
        include(includes.toString().split(','))
    }
}

