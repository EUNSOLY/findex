# 워크플로 이름 (GitHub Actions 탭에 이 이름으로 표시됨)
name: Format Check

# 실행 조건 (언제 이 워크플로를 돌릴지)
on:
  pull_request:
    branches: [ "main", "develop" ] # main, develop 브랜치로 향하는 PR이 열리거나 새 커밋이 올라올 때 실행
    paths-ignore: [ "**.md", "docs/**" ]

jobs:
  # 작업 이름 (브랜치 보호 규칙에서 "필수 통과 검사"로 지정할 때 이 이름을 사용)
  code-quality:
    runs-on: ubuntu-latest # GitHub가 빌려주는 우분투 가상 컴퓨터에서 실행
    steps:
      # 1. 저장소 코드를 가상 컴퓨터로 내려받기 (이 단계가 없으면 빈 폴더라 아무것도 못 함)
      - uses: actions/checkout@v4

      # 2. 자바(JDK) 설치
      - uses: actions/setup-java@v4
        with:
          distribution: temurin   # JDK 제조사 선택 (무료로 가장 많이 쓰는 Eclipse Temurin)
          java-version: '21'      # 프로젝트의 자바 버전과 맞춰야 함

      # 3. Gradle 준비 + 내려받은 라이브러리 저장해두기 (두 번째 실행부터 빨라짐)
      - uses: gradle/actions/setup-gradle@v4

      # 4. gradlew 파일에 실행 권한 주기
      #    (git에 실행 권한 없이 기록된 경우를 대비해, 실행 전에 권한을 붙여 "권한 없음" 오류를 방지)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 코드 포맷 검사
      #    규칙과 다르면 실패함 → 로컬에서 ./gradlew spotlessApply로 고친 뒤 다시 푸시
      - name: Spotless Check
        run: ./gradlew spotlessCheck

      # 6. 코드 규칙 검사 (네이밍 등 포맷터가 못 고치는 규칙)
      #    위반이 있으면 실패함 → 로그에 찍힌 파일:줄 위치를 보고 직접 수정 후 다시 푸시
      - name: Checkstyle Check
        run: ./gradlew checkstyleMain checkstyleTest